services:

  mysql:

    image: mysql:8.0

    container_name: pos_mysql

    restart: unless-stopped

    environment:

      MYSQL_ROOT_PASSWORD: RootStrongPassword123!

      MYSQL_DATABASE: pos_db

      MYSQL_USER: pos_user

      MYSQL_PASSWORD: PosStrongPassword123!

    volumes:

      - mysql_data:/var/lib/mysql

      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:

      - pos_network


  app:

    build:

      context: ./app

    container_name: pos_app

    restart: unless-stopped

    environment:

      DB_HOST: mysql

      DB_USER: pos_user

      DB_PASSWORD: PosStrongPassword123!

      DB_NAME: pos_db

      PORT: 3000

    depends_on:

      - mysql

    ports:

      - "3000:3000"

    networks:

      - pos_network


  phpmyadmin:

    image: phpmyadmin:latest

    container_name: pos_phpmyadmin

    restart: unless-stopped

    environment:

      PMA_HOST: mysql

      PMA_PORT: 3306

    depends_on:

      - mysql

    ports:

      - "8082:80"

    networks:

      - pos_network

  nginx:
    image: nginx:alpine
    container_name: pos_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - pos_network

networks:

  pos_network:

    driver: bridge


volumes:

  mysql_data: