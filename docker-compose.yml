services:

  mysql:

    image: mysql:8.0

    container_name: pos_mysql

    restart: unless-stopped

    environment:

      MYSQL_ROOT_PASSWORD: RootStrongPassword123!

      MYSQL_DATABASE: pos_db

      MYSQL_USER: pos_user

      MYSQL_PASSWORD: PosStrongPassword123!

    volumes:

      - mysql_data:/var/lib/mysql

      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:

      - pos_network


  app:

    build:

      context: ./app

    container_name: pos_app

    restart: unless-stopped

    environment:

      DB_HOST: mysql

      DB_USER: pos_user

      DB_PASSWORD: PosStrongPassword123!

      DB_NAME: pos_db

      PORT: 3000

    depends_on:

      - mysql

    ports:

      - "3000:3000"

    networks:

      - pos_network


  phpmyadmin:

    image: phpmyadmin:latest

    container_name: pos_phpmyadmin

    restart: unless-stopped

    environment:

      PMA_HOST: mysql

      PMA_PORT: 3306

    depends_on:

      - mysql

    ports:

      - "8082:80"

    networks:

      - pos_network

  nginx:
    image: nginx:alpine
    container_name: pos_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - pos_network

  prometheus:
    image: prom/prometheus:latest
    container_name: pos_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - pos_network

  grafana:
    image: grafana/grafana:latest
    container_name: pos_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - pos_network

  loki:
    image: grafana/loki:3.5.0
    container_name: pos_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - pos_network

  promtail:
    image: grafana/promtail:3.5.0
    container_name: pos_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - pos_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: pos_cadvisor
    restart: unless-stopped
    ports:
      - "8083:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - pos_network

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0
    container_name: pos_mysql_exporter
    restart: unless-stopped
    command:
      - "--config.my-cnf=/cfg/.my.cnf"
    volumes:
      - ./mysql-exporter/.my.cnf:/cfg/.my.cnf:ro
    depends_on:
      - mysql
    ports:
      - "9104:9104"
    networks:
      - pos_network
      
networks:

  pos_network:

    driver: bridge

volumes:

  mysql_data:
  grafana_data:
  loki_data: